{% extends "base.html" %}{% block content %}
<h2>Budget Planning</h2>
<form method="post" class="card card-body mb-4">
<div class="row g-2">
<div class="col-md-3"><input class="form-control" type="month" name="month" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="limit_amount" placeholder="Expense limit" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="savings_target" placeholder="Savings target" required></div>
<div class="col-md-3"><button class="btn btn-success w-100">Save Budget</button></div>
</div>
</form>
<table class="table table-bordered"><tr><th>Month</th><th>Expense Limit</th><th>Savings Target</th></tr>
{% for x in items %}<tr><td>{{x.month}}</td><td>₹{{"%.2f"|format(x.limit_amount)}}</td><td>₹{{"%.2f"|format(x.savings_target)}}</td></tr>{% endfor %}
</table>
{% endblock %}

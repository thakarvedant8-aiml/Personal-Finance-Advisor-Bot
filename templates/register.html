{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow"><div class="card-body">
<h2>Register</h2>
<form method="post">
<input class="form-control mb-3" name="name" placeholder="Full name" required>
<input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
<input class="form-control mb-3" name="password" type="password" placeholder="Password" minlength="6" required>
<button class="btn btn-success w-100">Register</button>
</form>
<p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div></div></div>
{% endblock %}

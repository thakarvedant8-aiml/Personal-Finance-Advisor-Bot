{% extends "base.html" %}{% block content %}
<h2>Expense Tracking</h2>
<form method="post" class="card card-body mb-4">
<div class="row g-2">
<div class="col-md-2"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div>
<div class="col-md-3"><select class="form-select" name="category" required>
<option>Rent</option><option>Food</option><option>Transport</option><option>Entertainment</option><option>Education</option><option>Healthcare</option><option>Utilities</option><option>Shopping</option><option>Other</option>
</select></div>
<div class="col-md-3"><input class="form-control" name="description" placeholder="Description"></div>
<div class="col-md-2"><input class="form-control" type="date" name="date" required></div>
<div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
</div>
</form>
<table class="table table-bordered"><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
{% for x in items %}<tr><td>{{x.date}}</td><td>{{x.category}}</td><td>{{x.description}}</td><td>₹{{"%.2f"|format(x.amount)}}</td></tr>{% endfor %}
</table>
{% endblock %}

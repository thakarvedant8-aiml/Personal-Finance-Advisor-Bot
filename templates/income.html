{% extends "base.html" %}{% block content %}
<h2>Income Management</h2>
<form method="post" class="card card-body mb-4">
<div class="row g-2">
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div>
<div class="col-md-4"><input class="form-control" name="source" placeholder="Source e.g. Salary" required></div>
<div class="col-md-3"><input class="form-control" type="date" name="date" required></div>
<div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
</div>
</form>
<table class="table table-bordered"><tr><th>Date</th><th>Source</th><th>Amount</th></tr>
{% for x in items %}<tr><td>{{x.date}}</td><td>{{x.source}}</td><td>₹{{"%.2f"|format(x.amount)}}</td></tr>{% endfor %}
</table>
{% endblock %}

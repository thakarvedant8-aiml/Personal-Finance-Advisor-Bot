{% extends "base.html" %}{% block content %}
<h2>Savings Goals</h2>
<form method="post" class="card card-body mb-4">
<div class="row g-2">
<div class="col-md-4"><input class="form-control" name="goal_name" placeholder="Goal name" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="target_amount" placeholder="Target amount" required></div>
<div class="col-md-3"><input class="form-control" type="number" step="0.01" name="saved_amount" placeholder="Already saved" value="0"></div>
<div class="col-md-2"><button class="btn btn-success w-100">Add Goal</button></div>
</div>
</form>
{% for x in items %}
<div class="card mb-3"><div class="card-body">
<h5>{{x.goal_name}}</h5>
<p>₹{{"%.2f"|format(x.saved_amount)}} / ₹{{"%.2f"|format(x.target_amount)}}</p>
<div class="progress"><div class="progress-bar" style="width:{{ [100, (x.saved_amount/x.target_amount*100) if x.target_amount else 0]|min }}%"></div></div>
</div></div>
{% endfor %}
{% endblock %}
